<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">FixBundle v0.3 verification proof</title><desc id="desc">Four tests pass and the historical Git demo preserves the current workspace while capturing a real old-commit failure.</desc>
<rect width="1200" height="620" rx="34" fill="#0a0f1d"/>
<rect x="34" y="34" width="1132" height="552" rx="22" fill="#050814" stroke="#273449"/>
<circle cx="76" cy="73" r="8" fill="#fb7185"/><circle cx="102" cy="73" r="8" fill="#facc15"/><circle cx="128" cy="73" r="8" fill="#4ade80"/>
<g font-family="Consolas,Menlo,monospace" font-size="23">
<text x="66" y="130" fill="#7dd3fc">$ python -m pytest -q</text>
<text x="66" y="171" fill="#86efac">....  4 passed</text>
<text x="66" y="232" fill="#7dd3fc">$ python scripts/demo.py</text>
<text x="66" y="273" fill="#86efac">PASS  incident_commit_matches</text>
<text x="66" y="312" fill="#86efac">PASS  current_head_preserved</text>
<text x="66" y="351" fill="#86efac">PASS  dirty_workspace_preserved</text>
<text x="66" y="390" fill="#86efac">PASS  old_buggy_source_captured</text>
<text x="66" y="429" fill="#86efac">PASS  real_failure_captured</text>
<text x="66" y="492" fill="#c4b5fd">--commit → detached worktree → AssertionError → evidence ZIP</text>
<text x="66" y="545" fill="#94a3b8">No checkout over current HEAD · no cloud upload · checksummed bundle</text>
</g>
</svg>
