<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">FixBundle v0.3 historical debugging demo</title>
<desc id="desc">Animated terminal transcript from the real FixBundle historical commit demo: old buggy commit is captured while current HEAD and uncommitted work remain intact.</desc>
<style>
  .frame { opacity: 0; animation: frameShow 16s infinite; }
  .f1 { animation-delay: 0s; } .f2 { animation-delay: 2s; }
  .f3 { animation-delay: 4s; } .f4 { animation-delay: 6s; }
  .f5 { animation-delay: 8s; } .f6 { animation-delay: 10s; }
  .f7 { animation-delay: 12s; } .f8 { animation-delay: 14s; }
  @keyframes frameShow { 0%, 11.5% { opacity: 1 } 12.5%, 100% { opacity: 0 } }
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d18"/><stop offset="1" stop-color="#10192b"/></linearGradient>
</defs>
<rect width="1200" height="720" rx="34" fill="url(#bg)"/>
<rect x="34" y="34" width="1132" height="652" rx="24" fill="#050814" stroke="#26344a"/>
<circle cx="76" cy="74" r="8" fill="#fb7185"/><circle cx="102" cy="74" r="8" fill="#facc15"/><circle cx="128" cy="74" r="8" fill="#4ade80"/>
<text x="165" y="82" fill="#94a3b8" font-size="20">FixBundle v0.3 · real historical incident demo</text>
<text x="66" y="650" fill="#64748b" font-size="18">source: scripts/demo.py · local-first · no checkout over current HEAD</text>

<g class="frame f1">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ git log --oneline -2</text>
  <text x="66" y="194" fill="#e2e8f0" font-size="25">52b7a18  current main is fixed</text>
  <text x="66" y="237" fill="#fca5a5" font-size="25">5c5f33a  buggy production state</text>
  <text x="66" y="305" fill="#94a3b8" font-size="23">The failure happened on an older revision.</text>
</g>
<g class="frame f2">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ git status --short</text>
  <text x="66" y="194" fill="#facc15" font-size="25">?? notes.txt</text>
  <text x="66" y="264" fill="#94a3b8" font-size="23">Uncommitted user work must survive the capture.</text>
</g>
<g class="frame f3">
  <text x="66" y="145" fill="#7dd3fc" font-size="24">$ fixbundle . --commit 5c5f33ac --run "python app.py" --lang tr</text>
  <text x="66" y="206" fill="#86efac" font-size="27">FixBundle hazır ✓</text>
  <text x="92" y="253" fill="#e2e8f0" font-size="23">Dosya: 1 · Komut: 1 · Redaction: 1</text>
  <text x="92" y="300" fill="#c4b5fd" font-size="23">historical-worktree capture</text>
</g>
<g class="frame f4">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ bundle/incident.json</text>
  <text x="66" y="194" fill="#e2e8f0" font-size="24">mode: historical-worktree</text>
  <text x="66" y="237" fill="#fca5a5" font-size="24">incident: 5c5f33ac</text>
  <text x="66" y="280" fill="#86efac" font-size="24">current : 52b7a185</text>
</g>
<g class="frame f5">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ bundle/project/app.py</text>
  <text x="66" y="200" fill="#e2e8f0" font-size="24">def total(a, b):</text>
  <text x="92" y="243" fill="#fca5a5" font-size="24">return a - b  # BUG</text>
  <text x="66" y="302" fill="#94a3b8" font-size="23">The bundle contains the old source, not today’s fixed file.</text>
</g>
<g class="frame f6">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ bundle/commands/01.log | tail</text>
  <text x="66" y="200" fill="#e2e8f0" font-size="23">File "&lt;PROJECT&gt;/app.py", line 4, in &lt;module&gt;</text>
  <text x="66" y="243" fill="#e2e8f0" font-size="23">assert total(2, 3) == 5</text>
  <text x="66" y="298" fill="#fca5a5" font-size="28">AssertionError</text>
</g>
<g class="frame f7">
  <text x="66" y="145" fill="#7dd3fc" font-size="25">$ git rev-parse --short HEAD</text>
  <text x="66" y="194" fill="#86efac" font-size="25">52b7a18</text>
  <text x="66" y="258" fill="#7dd3fc" font-size="25">$ git status --short</text>
  <text x="66" y="307" fill="#facc15" font-size="25">?? notes.txt</text>
  <text x="66" y="365" fill="#86efac" font-size="23">Current HEAD and dirty workspace are preserved.</text>
</g>
<g class="frame f8">
  <text x="66" y="150" fill="#86efac" font-size="27">PASS  incident_commit_matches</text>
  <text x="66" y="198" fill="#86efac" font-size="27">PASS  current_head_preserved</text>
  <text x="66" y="246" fill="#86efac" font-size="27">PASS  dirty_workspace_preserved</text>
  <text x="66" y="294" fill="#86efac" font-size="27">PASS  old_buggy_source_captured</text>
  <text x="66" y="342" fill="#86efac" font-size="27">PASS  real_failure_captured</text>
  <text x="66" y="420" fill="#c4b5fd" font-size="26">old commit → real failure → redacted evidence ZIP</text>
</g>
</svg>
