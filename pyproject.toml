[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixbundle"
version = "0.4.0"
description = "Package a broken repo, failed command, historical Git commit, or failed GitHub Actions run into a redacted AI-ready debugging bundle."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "yaaertu codeR"}]
keywords = ["ai", "debugging", "bug-report", "diagnostics", "github-actions", "codex", "claude-code", "cursor", "reproducibility", "support-bundle", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = []

[project.scripts]
fixbundle = "fixbundle.cli:main"

[project.urls]
Homepage = "https://github.com/yaertu/fixbundle"
Issues = "https://github.com/yaertu/fixbundle/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
