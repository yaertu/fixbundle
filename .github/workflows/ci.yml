name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip pytest
          python -m pip install -e .
      - name: Tests
        run: pytest -q
      - name: CLI smoke
        run: |
          fixbundle --version
          fixbundle . --recommend --lang en
      - name: Historical demo
        run: python scripts/demo.py
      - name: OTLP production evidence demo
        run: python scripts/demo_otlp.py
      - name: Cross-source compare demo
        run: python scripts/demo_compare.py

  live-github-evidence:
    name: Live GitHub failure evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FixBundle
        run: python -m pip install -e .
      - name: Capture real failed Actions run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf .fixbundle-live
          fixbundle github --repo yaertu/fixbundle --run 33587184675 --output .fixbundle-live --lang en
      - name: Verify portable evidence ZIP
        run: python scripts/verify_live_github.py .fixbundle-live
